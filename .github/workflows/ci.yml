name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own shellcheck (0.9.0) reports checks that newer releases renamed (SC2317 is
      # SC2329 for unused functions from 0.10.0), so CI runs the release contributors run.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      # Every shell file under script/ and lists/ (by .sh name or executable bit), plus the
      # Launcher's shell tests. The sourced test files resolve their includes from the repo root.
      - name: Shellcheck the script, the list check and the shell tests
        run: |
          shellcheck --version
          find script lists launcher/*.sh -type f \( -name '*.sh' -o -perm -u+x \) -print0 |
            xargs -0 shellcheck

  script-tests:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs them on its own /bin/bash 3.2, the bash the owner's Mac has.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fake-TV tests and list check
        run: |
          export PATH="/bin:$PATH"
          bash --version | sed -n 1p
          script/tests/run
          bash lists/check_test.sh

  launcher-build:
    name: Launcher build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # AGP 9.4 needs build-tools 36.0.0; the Launcher compiles against API 34.
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;36.0.0"'

      # check*LauncherManifest fails the build if the merged manifest has the INTERNET permission,
      # a receiver or an unlisted service. They also run under build; naming them keeps them here.
      - name: Build, lint and check the merged manifests
        run: ./gradlew build checkDebugLauncherManifest checkReleaseLauncherManifest

      - name: Adding INTERNET to the manifest fails the build
        run: ./manifest_check_test.sh

  launcher-ui-tests:
    name: Launcher UI tests (Android TV API 34 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;36.0.0"'

      # Android TV API 34 images exist only as x86 and arm64-v8a, so x86 is the one that runs on
      # the x86_64 runner (no x86_64 TV image is published for API 34).
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: launcher
          script: ./gradlew connectedDebugAndroidTest

      - name: Keep the UI test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-ui-test-reports
          path: launcher/app/build/reports/androidTests/
          if-no-files-found: ignore
