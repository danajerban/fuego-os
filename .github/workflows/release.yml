name: Release

# A pushed tag vX.Y.Z publishes a GitHub Release: the signed Launcher APK, its .apk.idsig (apksigner's
# v4 signature, for incremental installs; apply doesn't need it), the script bundle and SHA256SUMS
# of all three, with notes grouped by .github/release.yml. `fuego apply` installs the APK from the
# latest release and checks it against SHA256SUMS.
#
# A pull request that changes this workflow, or a manual run, is a dry run: the same build, signed
# with a throwaway key made in the job, kept as a workflow artifact and published nowhere. It never
# reads the signing secrets. Secret names and how the owner makes the key: docs/releasing.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The tag on a release; a placeholder on a dry run.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dry-run' }}
      UNSIGNED_APK: launcher/app/build/outputs/apk/release/app-release-unsigned.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Launcher's versionName is set by hand before tagging (docs/releasing.md).
      - name: The tag matches the Launcher's versionName
        if: github.event_name == 'push'
        run: |
          grep -q "versionName = \"${VERSION#v}\"" launcher/app/build.gradle.kts || {
            echo "::error::launcher/app/build.gradle.kts has no versionName = \"${VERSION#v}\" for the tag $VERSION"
            exit 1
          }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # AGP 9.4 needs build-tools 36.0.0; the Launcher compiles against API 34.
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;36.0.0"'

      # assembleRelease also fails if the merged manifest has the INTERNET permission, a receiver
      # or an unlisted service. Gradle leaves the APK unsigned; the steps below sign it.
      - name: Build the Launcher's release APK
        working-directory: launcher
        run: ./gradlew assembleRelease

      - name: Write the signing key from the Actions secrets
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets (docs/releasing.md)"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Make a throwaway signing key (dry run)
        if: github.event_name != 'push'
        env:
          RELEASE_KEYSTORE_PASSWORD: dry-run-throwaway
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass:env RELEASE_KEYSTORE_PASSWORD -alias fuego-os -keyalg RSA -keysize 4096 \
            -validity 1 -dname "CN=fuego-os dry run"

      # Passwords reach apksigner through the environment, never its command line.
      - name: Sign and verify the APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.RELEASE_KEYSTORE_PASSWORD || 'dry-run-throwaway' }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$build_tools/zipalign" -c -P 16 4 "$UNSIGNED_APK"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias fuego-os \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --out "dist/fuego-os-launcher-$VERSION.apk" \
            "$UNSIGNED_APK"
          "$build_tools/apksigner" verify --verbose --print-certs "dist/fuego-os-launcher-$VERSION.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # What the owner runs on the Mac: the script, the package lists beside it, and the docs.
      - name: Bundle the script and package lists
        run: |
          git archive --format=tar.gz --prefix="fuego-os-$VERSION/" -o "dist/fuego-os-$VERSION.tar.gz" \
            HEAD script/fuego lists docs/tv-setup.md README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md
          tar -tzf "dist/fuego-os-$VERSION.tar.gz"

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "fuego-os $TAG" \
            --generate-notes dist/*
